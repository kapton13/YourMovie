# Швидкі перевірки (код, типи, правила, словники) на кожну зміну — див. «Автоматичні перевірки» в CLAUDE.md.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
