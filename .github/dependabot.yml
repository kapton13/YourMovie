# Робот Dependabot: раз на тиждень пропонує оновити бібліотеки (дрібні оновлення — одним pull request),
# раз на місяць — дії GitHub. Великі оновлення (нова «головна» версія) — окремо, їх обговорюємо.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Сервер і роботи працюють на Node 22 — типи мають відповідати їй.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (новий компілятор) — перейдемо окремо, коли Next.js його офіційно підтримає.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Браузер для перевірок у середовищі Claude закріплено під 1.56; оновлюємо разом із ним.
      - dependency-name: "@playwright/test"
      # ESLint 10 — коли eslint-config-next його офіційно підтримає (власник погодив відкласти 2026-10-23).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
